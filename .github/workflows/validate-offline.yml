name: Validate and build offline dashboard

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'codigo-fonte/**'
      - 'index.html'
      - '.github/workflows/validate-offline.yml'
  push:
    branches: [main]
    paths:
      - 'codigo-fonte/**'
      - 'index.html'
      - '.github/workflows/validate-offline.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run automated tests
        working-directory: codigo-fonte
        run: npm test
      - name: Rebuild standalone HTML
        working-directory: codigo-fonte
        run: npm run build:offline
      - name: Verify generated outputs
        run: |
          test -s index.html
          test -s codigo-fonte/dist/app.offline.js
          python3 - <<'PY'
          from pathlib import Path
          html = Path('index.html').read_text(encoding='utf-8')
          js = Path('codigo-fonte/dist/app.offline.js').read_text(encoding='utf-8')
          assert 'quarterlyIntelligence' in html and 'commercialKpi' in html, 'New KPI code missing in offline HTML'
          assert 'inverterPhase' in js and 'grid-phase' in html, 'Inverter phase code missing'
          assert '<script' in html and '</html>' in html, 'Incomplete standalone HTML'
          print('Offline output checks passed')
          PY
      - name: Upload Windows-ready offline HTML
        uses: actions/upload-artifact@v4
        with:
          name: huawei-activation-analytics-offline
          path: index.html
          if-no-files-found: error
