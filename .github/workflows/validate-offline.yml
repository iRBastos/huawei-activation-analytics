name: Validate and build offline dashboard

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'codigo-fonte/**'
      - 'index.html'
      - 'codigo-fonte.zip'
      - 'documentacao/**'
      - 'templates/**'
      - 'README.md'
      - 'LEIA-ME.txt'
      - '.github/workflows/**'
      - '.github/QA-STATUS.md'
  push:
    branches: [main]
    paths:
      - 'codigo-fonte/**'
      - 'index.html'
      - 'codigo-fonte.zip'
      - 'documentacao/**'
      - 'templates/**'
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run automated tests
        working-directory: codigo-fonte
        shell: bash
        run: |
          set -o pipefail
          npm test | tee "$RUNNER_TEMP/huawei-tests.tap"
      - name: Rebuild standalone HTML and JavaScript
        working-directory: codigo-fonte
        run: python3 tools/build-offline.py
      - name: Test offline app in simulated DOM
        working-directory: codigo-fonte
        run: node tools/verify-offline.mjs
      - name: Test in real headless Chromium
        working-directory: codigo-fonte
        run: node tools/browser-smoke.mjs
      - name: Regenerate reproducible ZIP and verification summaries
        run: python3 codigo-fonte/tools/build-release.py --test-log "$RUNNER_TEMP/huawei-tests.tap"
      - name: Fail if committed distribution differs from sources
        shell: bash
        run: |
          git diff --exit-code -- index.html codigo-fonte/dist/app.offline.js codigo-fonte.zip codigo-fonte/dist/test-results.txt documentacao/test-results.txt
          test -s index.html
          test -s codigo-fonte.zip
          python3 - <<'PY'
          import zipfile
          from pathlib import Path
          with zipfile.ZipFile('codigo-fonte.zip') as z:
              names=set(z.namelist())
              assert not z.testzip(), "Corrupt ZIP"
              for f in ('index.html','codigo-fonte/dist/app.offline.js',
                        'codigo-fonte/dist/modules/inverter-catalog.js',
                        'codigo-fonte/tests/backup-migration.test.mjs',
                        'codigo-fonte/tools/browser-smoke.mjs',
                        'documentacao/test-results.txt'):
                  assert f in names, 'Missing from source ZIP: '+f
                  assert z.read(f)==Path(f).read_bytes(), 'Stale file in ZIP: '+f
          print("HTML, JS, test records and ZIP match the checked-out sources")
          PY
      - name: Upload distribution and browser evidence
        uses: actions/upload-artifact@v4
        with:
          name: huawei-activation-analytics-verified-release
          path: |
            index.html
            codigo-fonte.zip
            browser-smoke.png
          if-no-files-found: error
